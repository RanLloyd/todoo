{% extends 'auth_base.html' %}{% from '_macros.html' import flashes %}
{% block title %}Teacher sign in{% endblock %}
{% block body %}
<div class="auth-card"><img class="auth-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="Pila SHS crest">
<h1>Teacher Sign In</h1><p class="sub">Attendance Monitoring System</p>
{{ flashes() }}
<form method="post" autocomplete="on"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Username<input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
<label>Password<span class="pw"><input id="pw" name="password" type="password" autocomplete="current-password" required><button type="button" data-toggle-pw="#pw">Show</button></span></label>
<button class="btn primary block">Sign in</button></form>
<p class="auth-foot"><a href="{{ url_for('portal') }}">← Back</a> · <a href="{{ url_for('student_login') }}">I am a student</a></p></div>
{% endblock %}
